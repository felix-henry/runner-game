<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Original geometric controls for Fox / Dino Run. -->
  <symbol id="play" viewBox="0 0 24 24">
    <path d="M6.5 4 L19 12 L6.5 20 Z" />
  </symbol>
  <symbol id="pause" viewBox="0 0 24 24">
    <rect x="5.5" y="4" width="4" height="16" rx="0.75" />
    <rect x="14.5" y="4" width="4" height="16" rx="0.75" />
  </symbol>
  <symbol id="rotate-ccw" viewBox="0 0 24 24">
    <path d="M5 8.5 A8 8 0 1 1 4 14.5 M5 3.5 V8.5 H10" />
  </symbol>
  <symbol id="arrow-up" viewBox="0 0 24 24">
    <path d="M12 20 V4 M5.5 10.5 L12 4 L18.5 10.5" />
  </symbol>
  <symbol id="arrow-down" viewBox="0 0 24 24">
    <path d="M12 4 V20 M5.5 13.5 L12 20 L18.5 13.5" />
  </symbol>
  <symbol id="x" viewBox="0 0 24 24">
    <path d="M6.5 6.5 L17.5 17.5 M17.5 6.5 L6.5 17.5" />
  </symbol>
</svg>
